# ================================================================
# ScrapeForge — Docker Compose (15 Services)
# ================================================================

# Docker Compose v2+ (no version needed)

x-common-env: &common-env
  MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/scrapeforge}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-api-env: &api-env
  <<: *common-env
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
  TWO_CAPTCHA_API_KEY: ${TWO_CAPTCHA_API_KEY:-}
  PROXY_PROVIDER: ${PROXY_PROVIDER:-mock}
  API_PORT: 3000

x-python-env: &python-env
  <<: *common-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TWO_CAPTCHA_API_KEY: ${TWO_CAPTCHA_API_KEY:-}
  CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY:-}
  PROXY_PROVIDER: ${PROXY_PROVIDER:-mock}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ════════════════════════════════════════
  # Infrastructure
  # ════════════════════════════════════════

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sf-dashboard
    ports:
      - "5173:5173"
    depends_on:
      api-1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrapeforge

  nginx:
    image: nginx:1.27-alpine
    container_name: sf-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      dashboard:
        condition: service_started
    restart: unless-stopped
    networks:
      - scrapeforge

  redis:
    image: redis:7.4-alpine
    container_name: sf-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults
    restart: unless-stopped
    networks:
      - scrapeforge

  mongo:
    image: mongo:7.0
    container_name: sf-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      <<: *healthcheck-defaults
    restart: unless-stopped
    networks:
      - scrapeforge

  # ════════════════════════════════════════
  # API Gateway (2 replicas, load balanced)
  # ════════════════════════════════════════

  api-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sf-api-1
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1))"]
      <<: *healthcheck-defaults
    restart: unless-stopped
    networks:
      - scrapeforge

  api-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sf-api-2
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1))"]
      <<: *healthcheck-defaults
    restart: unless-stopped
    networks:
      - scrapeforge

  # ════════════════════════════════════════
  # Python Workers
  # ════════════════════════════════════════

  python-http:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: sf-python-http
    environment:
      <<: *python-env
      WORKER_TYPE: http
      WORKER_CONCURRENCY: ${HTTP_WORKER_CONCURRENCY:-200}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    networks:
      - scrapeforge

  python-browser:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: sf-python-browser
    environment:
      <<: *python-env
      WORKER_TYPE: browser
      WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-50}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      replicas: 1
    shm_size: '2gb'
    restart: unless-stopped
    networks:
      - scrapeforge

  node-browser:
    build:
      context: ./workers/node-browser
      dockerfile: Dockerfile
    container_name: sf-node-browser
    environment:
      <<: *common-env
      WORKER_TYPE: browser
      WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-50}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    shm_size: '2gb'
    restart: unless-stopped
    networks:
      - scrapeforge

  crawl-worker:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: sf-crawl-worker
    environment:
      <<: *python-env
      WORKER_TYPE: crawl
      WORKER_CONCURRENCY: ${CRAWL_WORKER_CONCURRENCY:-100}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    networks:
      - scrapeforge

  serp-worker:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: sf-serp-worker
    environment:
      <<: *python-env
      WORKER_TYPE: serp
      WORKER_CONCURRENCY: ${SERP_WORKER_CONCURRENCY:-200}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    networks:
      - scrapeforge

  # ════════════════════════════════════════
  # Background Services
  # ════════════════════════════════════════

  proxy-checker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: sf-proxy-checker
    command: ["node", "proxy-checker/index.js"]
    environment:
      <<: *common-env
      CHECK_INTERVAL: ${PROXY_CHECK_INTERVAL:-300000}
      MAX_FAILURES: ${PROXY_MAX_CONSECUTIVE_FAILURES:-3}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrapeforge

  domain-learner:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: sf-domain-learner
    command: ["node", "domain-learner/index.js"]
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrapeforge

  scheduler:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: sf-scheduler
    command: ["node", "scheduler/index.js"]
    environment:
      <<: *common-env
      CHECK_INTERVAL: ${SCHEDULER_CHECK_INTERVAL:-60000}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrapeforge

  change-detector:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: sf-change-detector
    command: ["node", "change-detector/index.js"]
    environment:
      <<: *common-env
      BATCH_SIZE: ${CHANGE_DETECT_BATCH_SIZE:-100}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrapeforge

volumes:
  redis_data:
  mongo_data:

networks:
  scrapeforge:
    driver: bridge
